# main 브랜치에 push하면 앱을 빌드해서 GitHub Pages에 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # webapp → dist (i18n 한글 이스케이프, Component-preload 생성)
      - run: npx ui5 build --clean-dest

      # GitHub Pages에는 ui5 serve가 없으므로 UI5 라이브러리를 SAP 공식 CDN에서 받는다.
      # 버전은 ui5.yaml 의 framework.version 과 맞출 것.
      - name: Use SAPUI5 CDN
        run: sed -i 's#src="resources/sap-ui-core.js"#src="https://ui5.sap.com/1.136.23/resources/sap-ui-core.js"#' dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
